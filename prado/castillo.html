<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Castillo | prueba de estilos</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #1b1f3a;
            font-family: Arial, sans-serif;
        }

        .estilos {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 4px;
            padding: 5px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(10px);
        }

        .estilos a {
            color: #ffffff;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 22px;
            font-size: 14px;
        }

        .estilos a.activo {
            background: rgba(255, 255, 255, 0.9);
            color: #1b1f3a;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <nav class="estilos">
        <a href="?estilo=voxel" id="enlace-voxel">Voxel</a>
        <a href="?estilo=lowpoly" id="enlace-lowpoly">Low poly</a>
    </nav>

    <script type="module">
        import * as THREE from "three";
        import { OrbitControls } from "three/addons/controls/OrbitControls.js";
        import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
        import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
        import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
        import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

        // ---------- Ajustes ----------

        const estilo = new URLSearchParams(location.search).get("estilo") === "lowpoly" ? "lowpoly" : "voxel";
        document.getElementById("enlace-" + estilo).classList.add("activo");

        let semilla = 7;
        function azar() {
            semilla = (semilla * 16807) % 2147483647;
            return (semilla - 1) / 2147483646;
        }

        // ---------- Escena ----------

        const renderizador = new THREE.WebGLRenderer({ antialias: true });
        renderizador.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderizador.setSize(innerWidth, innerHeight);
        renderizador.toneMapping = THREE.ACESFilmicToneMapping;
        document.body.prepend(renderizador.domElement);

        const escena = new THREE.Scene();
        escena.fog = new THREE.Fog("#4a4f86", 140, 520);

        const camara = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 1, 3000);
        camara.position.set(0, 55, 230);
        const controles = new OrbitControls(camara, renderizador.domElement);
        controles.target.set(0, 70, 0);
        controles.enableDamping = true;

        const cielo = new THREE.Mesh(
            new THREE.SphereGeometry(1500, 32, 16),
            new THREE.ShaderMaterial({
                side: THREE.BackSide,
                depthWrite: false,
                vertexShader: "varying vec3 v; void main(){ v = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
                fragmentShader: `
                    varying vec3 v;
                    void main() {
                        float h = normalize(v).y;
                        float lado = normalize(v).x;
                        vec3 c = mix(vec3(0.98, 0.55, 0.45), vec3(0.42, 0.33, 0.62), smoothstep(0.0, 0.25, h));
                        c = mix(c, vec3(0.13, 0.14, 0.33), smoothstep(0.2, 0.7, h));
                        c += vec3(0.5, 0.25, 0.1) * pow(max(lado, 0.0), 3.0) * (1.0 - smoothstep(0.0, 0.3, h));
                        gl_FragColor = vec4(c, 1.0);
                        #include <colorspace_fragment>
                    }
                `
            })
        );
        escena.add(cielo);

        escena.add(new THREE.HemisphereLight("#8f9be0", "#2a2440", 1.1));
        const sol = new THREE.DirectionalLight("#ffb48a", 1.6);
        sol.position.set(200, 80, 60);
        escena.add(sol);

        // ---------- Diseño común del castillo ----------
        // x, z, radio, alto (desde la cima), alto del tejado

        const torres = [
            [0, -2, 7, 62, 34],
            [-14, 4, 4.5, 40, 18],
            [14, 4, 4.5, 38, 17],
            [-7, -12, 3.5, 50, 20],
            [8, -13, 3.5, 47, 19],
            [-24, 8, 3.5, 24, 13],
            [24, 8, 3.5, 22, 12],
            [-5, 14, 3, 18, 10],
            [5, 14, 3, 18, 10]
        ];
        const cuerpos = [
            [0, 2, 26, 26, 20],
            [0, -3, 14, 44, 13]
        ];
        const cima = 46;

        const ventanas = [];
        const colorPiedra = new THREE.Color("#d8c7a8");
        const colorTejado = new THREE.Color("#2e3f8c");
        const colorRoca = new THREE.Color("#5d5a6b");
        const colorVerde = new THREE.Color("#3f5b3e");

        function alturaMontana(x, z) {
            const r = Math.hypot(x, z * 1.2);
            const base = cima * Math.max(0, 1 - Math.pow(Math.max(0, r - 26) / 70, 1.3));
            return r < 30 ? cima : base + Math.sin(x * 0.3) * Math.cos(z * 0.27) * 3;
        }

        // ---------- Estilo VOXEL ----------

        function construirVoxel() {
            const piedras = [];
            const tejados = [];
            const rocas = [];
            const luces = [];

            for (let x = -95; x <= 95; x++) {
                for (let z = -80; z <= 80; z++) {
                    const h = Math.round(alturaMontana(x, z));
                    if (h <= 0) continue;
                    for (let y = Math.max(0, h - 6); y < h; y++) rocas.push([x, y, z, y > h - 2 && h < cima - 2 ? 1 : 0]);
                }
            }

            torres.forEach(([tx, tz, r, alto, tejado]) => {
                for (let y = 0; y < alto; y++) {
                    for (let x = -Math.ceil(r); x <= Math.ceil(r); x++) {
                        for (let z = -Math.ceil(r); z <= Math.ceil(r); z++) {
                            const d = Math.hypot(x, z);
                            if (d > r || d < r - 1.2) continue;
                            const pos = [tx + x, cima + y, tz + z];
                            const esVentana = y % 6 === 3 && z > r * 0.4 && Math.abs(x) % 3 === 1 && azar() < 0.75;
                            (esVentana ? luces : piedras).push(pos);
                        }
                    }
                }
                for (let x = -Math.ceil(r) - 1; x <= Math.ceil(r) + 1; x++) {
                    for (let z = -Math.ceil(r) - 1; z <= Math.ceil(r) + 1; z++) {
                        const d = Math.hypot(x, z);
                        if (d <= r + 1 && d > r - 0.2 && (x + z) % 2 === 0) piedras.push([tx + x, cima + alto, tz + z]);
                    }
                }
                for (let y = 0; y < tejado; y++) {
                    const rr = (r + 1) * (1 - y / tejado);
                    for (let x = -Math.ceil(rr); x <= Math.ceil(rr); x++) {
                        for (let z = -Math.ceil(rr); z <= Math.ceil(rr); z++) {
                            const d = Math.hypot(x, z);
                            if (d <= rr && d > rr - 1.3) tejados.push([tx + x, cima + alto + 1 + y, tz + z]);
                        }
                    }
                }
            });

            cuerpos.forEach(([cx, cz, ancho, alto, fondo]) => {
                for (let y = 0; y < alto; y++) {
                    for (let x = -ancho / 2; x <= ancho / 2; x++) {
                        for (let z = -fondo / 2; z <= fondo / 2; z++) {
                            const borde = Math.abs(x) === ancho / 2 || Math.abs(z) === fondo / 2;
                            if (!borde) continue;
                            const pos = [cx + x, cima + y, cz + z];
                            const esVentana = z === fondo / 2 && y % 5 === 2 && Math.abs(x) % 3 === 1 && azar() < 0.7;
                            (esVentana ? luces : piedras).push(pos);
                        }
                    }
                }
            });

            for (let x = -30; x <= 30; x++) {
                for (let y = 0; y < 10; y++) piedras.push([x, cima + y, 20]);
                if (x % 2 === 0) piedras.push([x, cima + 10, 20]);
            }
            for (let y = 0; y < 7; y++) for (let x = -2; x <= 2; x++) luces.push([x, cima + y, 20.6]);

            function malla(lista, material, colorear) {
                const m = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), material, lista.length);
                const ayudante = new THREE.Object3D();
                const c = new THREE.Color();
                lista.forEach((p, i) => {
                    ayudante.position.set(p[0], p[1], p[2]);
                    ayudante.updateMatrix();
                    m.setMatrixAt(i, ayudante.matrix);
                    if (colorear) m.setColorAt(i, colorear(p, c));
                });
                escena.add(m);
            }

            malla(rocas, new THREE.MeshStandardMaterial({ roughness: 1 }), (p, c) => c.copy(p[3] ? colorVerde : colorRoca).multiplyScalar(0.85 + azar() * 0.3));
            malla(piedras, new THREE.MeshStandardMaterial({ roughness: 0.9 }), (p, c) => c.copy(colorPiedra).multiplyScalar(0.85 + azar() * 0.25));
            malla(tejados, new THREE.MeshStandardMaterial({ roughness: 0.7 }), (p, c) => c.copy(colorTejado).multiplyScalar(0.85 + azar() * 0.3));
            malla(luces, new THREE.MeshBasicMaterial({ color: new THREE.Color("#ffb45c").multiplyScalar(4) }));
        }

        // ---------- Estilo LOW POLY ----------

        function construirLowPoly() {
            const piedra = new THREE.MeshStandardMaterial({ color: colorPiedra, roughness: 0.9, flatShading: true });
            const piedraOscura = new THREE.MeshStandardMaterial({ color: new THREE.Color("#bba98a"), roughness: 0.9, flatShading: true });
            const tejado = new THREE.MeshStandardMaterial({ color: colorTejado, roughness: 0.7, flatShading: true });
            const luz = new THREE.MeshBasicMaterial({ color: new THREE.Color("#ffb45c").multiplyScalar(4) });

            const geo = new THREE.ConeGeometry(100, cima + 4, 11, 6).toNonIndexed();
            const v = geo.attributes.position;
            const mapa = new Map();
            for (let i = 0; i < v.count; i++) {
                const k = v.getX(i).toFixed(1) + v.getY(i).toFixed(1) + v.getZ(i).toFixed(1);
                if (!mapa.has(k)) mapa.set(k, [(azar() - 0.5) * 9, (azar() - 0.5) * 6, (azar() - 0.5) * 9]);
                const d = mapa.get(k);
                v.setXYZ(i, v.getX(i) + d[0], Math.min(v.getY(i) + d[1], (cima + 4) / 2 - 6), v.getZ(i) + d[2]);
            }
            geo.computeVertexNormals();
            const montana = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: colorRoca, roughness: 1, flatShading: true }));
            montana.position.y = (cima + 4) / 2 - 2;
            montana.scale.z = 0.8;
            escena.add(montana);
            const meseta = new THREE.Mesh(new THREE.CylinderGeometry(32, 40, 4, 9), montana.material);
            meseta.position.y = cima - 2;
            escena.add(meseta);

            torres.forEach(([tx, tz, r, alto, altoTejado]) => {
                const cuerpo = new THREE.Mesh(new THREE.CylinderGeometry(r, r * 1.05, alto, 8), piedra);
                cuerpo.position.set(tx, cima + alto / 2, tz);
                const corona = new THREE.Mesh(new THREE.CylinderGeometry(r * 1.2, r, 2, 8), piedraOscura);
                corona.position.set(tx, cima + alto, tz);
                const techo = new THREE.Mesh(new THREE.ConeGeometry(r * 1.3, altoTejado, 8), tejado);
                techo.position.set(tx, cima + alto + 1 + altoTejado / 2, tz);
                escena.add(cuerpo, corona, techo);
                for (let y = 4; y < alto - 3; y += 6) {
                    for (let a = -1; a <= 1; a++) {
                        if (azar() < 0.3) continue;
                        const ang = a * 0.55;
                        const ventana = new THREE.Mesh(new THREE.PlaneGeometry(1, 1.8), luz);
                        ventana.position.set(tx + Math.sin(ang) * (r + 0.05), cima + y, tz + Math.cos(ang) * (r + 0.05));
                        ventana.rotation.y = ang;
                        escena.add(ventana);
                    }
                }
            });

            cuerpos.forEach(([cx, cz, ancho, alto, fondo]) => {
                const caja = new THREE.Mesh(new THREE.BoxGeometry(ancho, alto, fondo), piedra);
                caja.position.set(cx, cima + alto / 2, cz);
                escena.add(caja);
                for (let y = 3; y < alto - 2; y += 5) {
                    for (let x = -ancho / 2 + 3; x < ancho / 2 - 1; x += 3.5) {
                        if (azar() < 0.3) continue;
                        const ventana = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 2), luz);
                        ventana.position.set(cx + x, cima + y, cz + fondo / 2 + 0.05);
                        escena.add(ventana);
                    }
                }
            });

            const muro = new THREE.Mesh(new THREE.BoxGeometry(60, 10, 2), piedraOscura);
            muro.position.set(0, cima + 5, 20);
            const puerta = new THREE.Mesh(new THREE.PlaneGeometry(5, 7), luz);
            puerta.position.set(0, cima + 3.5, 21.05);
            escena.add(muro, puerta);
        }

        if (estilo === "voxel") construirVoxel();
        else construirLowPoly();

        // ---------- Bosque oscuro en primer plano para dar escala ----------

        const bosque = new THREE.InstancedMesh(new THREE.ConeGeometry(4, 16, estilo === "voxel" ? 4 : 6), new THREE.MeshStandardMaterial({ color: "#1d2a35", flatShading: true }), 90);
        const ayudante = new THREE.Object3D();
        for (let i = 0; i < 90; i++) {
            ayudante.position.set((azar() - 0.5) * 360, 4 + azar() * 4, 110 + azar() * 60);
            ayudante.scale.setScalar(0.7 + azar() * 0.8);
            ayudante.updateMatrix();
            bosque.setMatrixAt(i, ayudante.matrix);
        }
        escena.add(bosque);

        const niebla = new THREE.Mesh(new THREE.PlaneGeometry(900, 900), new THREE.MeshBasicMaterial({ color: "#8a86c0", transparent: true, opacity: 0.55, depthWrite: false }));
        niebla.rotation.x = -Math.PI / 2;
        niebla.position.y = 8;
        escena.add(niebla);

        // ---------- Postprocesado y bucle ----------

        const compositor = new EffectComposer(renderizador);
        compositor.addPass(new RenderPass(escena, camara));
        compositor.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.6, 0.5, 0.85));
        compositor.addPass(new OutputPass());

        function animar() {
            requestAnimationFrame(animar);
            controles.update();
            compositor.render();
        }
        animar();

        addEventListener("resize", () => {
            camara.aspect = innerWidth / innerHeight;
            camara.updateProjectionMatrix();
            renderizador.setSize(innerWidth, innerHeight);
            compositor.setSize(innerWidth, innerHeight);
        });
    </script>
</body>
</html>
