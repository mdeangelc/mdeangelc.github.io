<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El prado | Miguel Ángel Calvente Medina</title>
    <meta name="description" content="Un paseo en 3D por un prado hasta un castillo, hecho con three.js por Miguel Ángel Calvente Medina.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilo.css?v=3">
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div class="vineta"></div>

    <a class="volver" href="../">Volver al portfolio</a>

    <div class="controles">
        <div class="grupo" id="momentos">
            <button data-momento="manana">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                Mañana
            </button>
            <button data-momento="atardecer" class="activo">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18a5 5 0 0 1 10 0M2 18h20M5 22h14M12 9V3M8.5 6.5 12 3l3.5 3.5"/></svg>
                Atardecer
            </button>
            <button data-momento="noche">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
                Noche
            </button>
        </div>
        <div class="grupo">
            <button id="boton-caminar">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="13" cy="4" r="2"/><path d="M10 21l2-6 3 3v3M8 11l3-3 3 2 3 1M11 8l-1 5"/></svg>
                Caminar
            </button>
            <button id="boton-dof">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/></svg>
                DOF
            </button>
        </div>
    </div>

    <div class="progreso">
        <div class="relleno" id="relleno"></div>
    </div>

    <p class="pista" id="pista">Usa la rueda del ratón para caminar</p>
    <p class="cargando" id="cargando">Preparando el prado...</p>

    <script type="module" src="escena.js?v=5"></script>
</body>
</html>
