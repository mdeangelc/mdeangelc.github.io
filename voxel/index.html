<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El camino al castillo (voxel) | Miguel Ángel Calvente Medina</title>
    <meta name="description" content="Un valle de fantasía hecho con cubos en three.js: castillo, aldea, río con reflejos y cuatro ambientes. Por Miguel Ángel Calvente Medina.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilo.css?v=3">
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <header class="titulo">
        <h1>El camino al castillo</h1>
        <p>Versión voxel</p>
    </header>

    <a class="volver" href="../">Volver al portfolio</a>

    <nav class="panel" id="panel" aria-label="Controles de la escena">
        <div class="grupo">
            <p class="etiqueta">Vista</p>
            <div class="botones">
                <button data-vista="0" class="activo" aria-pressed="true">Valle</button>
                <button data-vista="1" aria-pressed="false">Río</button>
                <button data-vista="2" aria-pressed="false">Camino</button>
                <button data-vista="3" aria-pressed="false">Colina</button>
                <button id="boton-a-pie" aria-pressed="false">A pie</button>
            </div>
        </div>
        <div class="grupo">
            <p class="etiqueta">Ambiente</p>
            <div class="botones">
                <button data-ambiente="manana" aria-pressed="false">Mañana</button>
                <button data-ambiente="atardecer" class="activo" aria-pressed="true">Atardecer</button>
                <button data-ambiente="noche" aria-pressed="false">Noche</button>
            </div>
        </div>
        <div class="grupo">
            <p class="etiqueta">Opciones</p>
            <div class="botones">
                <button id="boton-paseo" aria-pressed="false">Paseo</button>
                <button id="boton-sonido" aria-pressed="false">Sonido</button>
                <button id="boton-centrar">Centrar</button>
                <button id="boton-guardar">Foto</button>
                <button id="boton-ocultar">Ocultar</button>
            </div>
        </div>
    </nav>

    <button class="menu" id="boton-menu" aria-expanded="false" aria-controls="panel">Controles</button>
    <button class="mostrar" id="boton-mostrar">Mostrar controles</button>

    <p class="pista" id="pista">Arrastra para girar · rueda o pellizco para acercarte</p>
    <p class="cargando" id="cargando">Construyendo el valle...</p>

    <script type="module" src="escena.js?v=7"></script>
</body>
</html>
